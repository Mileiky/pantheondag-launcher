<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>PantheonDAG</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f9; --panel: #fff; --text: #1b1f27; --muted: #616b7a; --line: #dce0e6; --accent: #6d5ce7; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15171c; --panel: #1f2229; --text: #eef0f4; --muted: #a2aab7; --line: #343945; --accent: #8b7df0; } }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(440px, 100%); padding: 32px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.15; }
    p { margin: 0; color: var(--muted); }
    a.start { display: block; margin: 24px 0 14px; padding: 12px 16px; border-radius: 8px; background: var(--accent); color: #fff; text-align: center; font-weight: 650; text-decoration: none; }
    a.start:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
    #status { min-height: 1.5em; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>PantheonDAG</h1>
    <p>Start the analysis workspace on this computer.</p>
    <a class="start" id="start" href="pantheondag://start">Start PantheonDAG</a>
    <p id="status" role="status"></p>
  </main>
  <script>
    document.getElementById('start').addEventListener('click', function () {
      document.getElementById('status').textContent = 'Starting. Your chat will open in a new tab.';
    });
  </script>
</body>
</html>
